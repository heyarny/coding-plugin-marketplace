name: Sync Mermaid Docs

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-mermaid-docs
  cancel-in-progress: false

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout Mermaid docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mermaid-js/mermaid
          path: mermaid-source
          persist-credentials: false
          sparse-checkout: |
            docs/syntax
            docs/config
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Sync documentation and plugin versions
        run: python3 -m scripts.sync_mermaid_docs mermaid-source

      - name: Validate marketplace and sync tooling
        run: |
          python3 scripts/validate_marketplace.py
          python3 -m unittest discover -s tests -v

      - name: Commit and push documentation updates
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "docs: sync mermaid syntax and config docs"
          file_pattern: "plugins/mermaid/skills/mermaid/references/*.md plugins/mermaid/plugin.json plugins/mermaid/.claude-plugin/plugin.json"
